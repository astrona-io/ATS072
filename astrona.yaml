        pass_score: 70

  - id: module-020
    title: "Customizing Backstage plugins"
    description: >
      Makes the reader able to change a Backstage plugin without forking it:
      layered app-config files with environment substitution, a config.d.ts
      schema with visibility tags, configuration read through
      coreServices.rootConfig and configApiRef, backend modules that use
      extension points, frontend extension overrides, permission policies
      that follow the decision contract, and compatible upgrades with
      backstage-cli versions:bump.

    content:
      - type: reading
        title: "Customizing Backstage plugins"
        path: sections/section-020/README.md

      - type: reading
        title: "Configuring Plugins With app-config.yaml"
        path: sections/section-020/module-01/course.md
      - type: reading
        title: "How Backstage Loads And Layers Configuration"
        path: sections/section-020/module-01/course-01-how-backstage-loads-and-layers-configuration.md
      - type: reading
        title: "Declaring A Configuration Schema In config.d.ts"
        path: sections/section-020/module-01/course-02-declaring-a-configuration-schema-in-config-d-ts.md
      - type: reading
        title: "Reading Configuration In Backend And Frontend Plugins"
        path: sections/section-020/module-01/course-03-reading-configuration-in-backend-and-frontend-plugins.md
      - type: reading
        title: "Question"
        path: sections/section-020/module-01/labs/lab-01/question.md
      - type: lab
        title: "Configuring Plugins With app-config.yaml Lab"
        path: sections/section-020/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 30m
        topic: backstage-configuration
        task_kind: fix
        tags: [app-config, environment-substitution, config-d-ts, visibility, rootconfig, configapiref]
        learning_goals:
          - Read a secret and a URL from the environment with substitution
          - Tag a configuration schema with secret and frontend visibility and register it in package.json
          - Read configuration in a backend plugin through coreServices.rootConfig and keep the secret out of the browser
        resources:
          - name: "Writing configuration"
            url: https://backstage.io/docs/conf/writing
          - name: "Defining configuration for your plugin"
            url: https://backstage.io/docs/conf/defining
          - name: "Reading Backstage configuration"
            url: https://backstage.io/docs/conf/reading
      - type: reading
        title: "Summary"
        path: sections/section-020/module-01/course-04-summary.md

      - type: reading
        title: "Extending And Overriding Plugins Safely"
        path: sections/section-020/module-02/course.md
      - type: reading
        title: "Extending Backend Plugins With Modules And Extension Points"
        path: sections/section-020/module-02/course-01-extending-backend-plugins-with-modules-and-extension-points.md
      - type: reading
        title: "Overriding Frontend Extensions Without Forking"
        path: sections/section-020/module-02/course-02-overriding-frontend-extensions-without-forking.md
      - type: reading
        title: "Permission Policies, Compatibility And Upgrades"
        path: sections/section-020/module-02/course-03-permission-policies-compatibility-and-upgrades.md
      - type: reading
        title: "Question"
        path: sections/section-020/module-02/labs/lab-01/question.md
      - type: lab
        title: "Extending And Overriding Plugins Safely Lab"
        path: sections/section-020/module-02/labs/lab-01
        difficulty: intermediate
        estimated_duration: 40m
        topic: backstage-extension
        task_kind: fix
        tags: [backend-module, extension-point, permission-policy, app-extensions, versions-bump]
        learning_goals:
          - Write and register a catalog backend module with createBackendModule
          - Write a permission policy that denies by default and register it
          - Configure a frontend extension path and align @backstage package versions
        resources:
          - name: "Backend plugins and modules"
            url: https://backstage.io/docs/backend-system/building-plugins-and-modules/index
          - name: "Writing a permission policy"
            url: https://backstage.io/docs/permissions/writing-a-policy
          - name: "Configuring extensions"
            url: https://backstage.io/docs/frontend-system/building-apps/configuring-extensions
          - name: "Keeping Backstage updated"
            url: https://backstage.io/docs/getting-started/keeping-backstage-updated
      - type: reading
        title: "Summary"
        path: sections/section-020/module-02/course-04-summary.md

      - type: reading
        title: "Question"
        path: sections/section-020/capstone/labs/lab-01/question.md
      - type: lab
        title: "Customizing Backstage Plugins Capstone"
        path: sections/section-020/capstone/labs/lab-01
        difficulty: advanced
        estimated_duration: 60m
        topic: backstage-customization
        task_kind: build
        tags: [app-config, config-d-ts, rootconfig, backend-module, permission-policy, app-extensions]
        learning_goals:
          - Layer configuration files and keep secrets out of committed files
          - Register a schema and read configuration through rootConfig in a plugin and a module
          - Register a catalog module and a deny-by-default permission policy and move a page with app.extensions
        resources:
          - name: "Writing configuration"
            url: https://backstage.io/docs/conf/writing
          - name: "Defining configuration for your plugin"
            url: https://backstage.io/docs/conf/defining
          - name: "Writing a permission policy"
            url: https://backstage.io/docs/permissions/writing-a-policy
      - type: quiz
        title: "Knowledge Check: Customizing Backstage plugins"
        path: sections/section-020/quiz.yaml
        pass_score: 70

