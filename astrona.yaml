# Course manifest for ATS072: readings, playgrounds, graded labs, capstones and quizzes. Labs are built untested.
training:
  id: ATS072
  title: 'CBA: Customizing Backstage'
  description: 'Teaching material, playgrounds, graded labs, capstones and quizzes for CBA: Customizing Backstage. Labs run in qemu virtual machines and are built untested. Technical content remains draft.'
  certification:
    name: Certified Backstage Associate
    code: CBA
    provider: CNCF / Linux Foundation
    domain: Customizing Backstage
    weight: 32
    competencies:
    - Understand frontend versus backend plugins
    - Customizing Backstage plugins
    - Make changes to React code in Backstage App
    - Using Material UI components
modules:
  - id: module-intro
    title: Introduction
    description: Audience, how to use playgrounds and labs, and review process.
    content:
      - type: reading
        title: Introduction
        path: sections/intro/README.md
      - type: reading
        title: Welcome To The Course
        path: sections/intro/course-01-welcome.md
      - type: reading
        title: Get Your Machine Ready
        path: sections/intro/course-02-get-your-machine-ready.md
      - type: reading
        title: How This Course Is Made
        path: sections/intro/course-03-how-this-course-is-made.md

  - id: module-010
    title: "Understand frontend versus backend plugins"
    description: >
      Makes the reader able to tell frontend plugins from backend plugins and
      to wire each into a Backstage app: plugin packages, routes and
      extensions, registration in the app package, the new frontend system,
      the new backend system, core services, extension points, backend
      modules and architecture-version compatibility.
    status: alpha
    content:
      - type: reading
        title: "Understand frontend versus backend plugins"
        path: sections/section-010/README.md

      - type: reading
        title: "Frontend Plugins And The Frontend System"
        path: sections/section-010/module-01/course.md
      - type: reading
        title: "What A Frontend Plugin Package Contains"
        path: sections/section-010/module-01/course-01-what-a-frontend-plugin-package-contains.md
      - type: reading
        title: "Registering A Plugin In The App Package"
        path: sections/section-010/module-01/course-02-registering-a-plugin-in-the-app-package.md
      - type: reading
        title: "Question"
        path: sections/section-010/module-01/labs/lab-01/question.md
      - type: lab
        title: "Register A Frontend Plugin In The App Lab"
        path: sections/section-010/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 25m
        topic: backstage-plugins
        task_kind: fix
        tags: [backstage, frontend-plugin, createPlugin, createRoutableExtension, flatroutes, app-package]
        learning_goals:
          - Export a routable extension from a frontend plugin with createRoutableExtension
          - Add the plugin package as a dependency of the app package
          - Import the page in App.tsx and add a route inside FlatRoutes
        resources:
          - name: "Structure of a plugin"
            url: https://backstage.io/docs/plugins/structure-of-a-plugin
          - name: "Backstage plugins overview"
            url: https://backstage.io/docs/plugins/
      - type: reading
        title: "The New Frontend System: Plugins And Extensions"
        path: sections/section-010/module-01/course-03-the-new-frontend-system.md
      - type: reading
        title: "Summary"
        path: sections/section-010/module-01/course-04-summary.md

      - type: reading
        title: "Backend Plugins, Modules, Services And Extension Points"
        path: sections/section-010/module-02/course.md
      - type: reading
        title: "Backend Plugins And The New Backend System"
        path: sections/section-010/module-02/course-01-backend-plugins-and-the-new-backend-system.md
      - type: reading
        title: "Core Services And Dependency Injection"
        path: sections/section-010/module-02/course-02-core-services-and-dependency-injection.md
      - type: reading
        title: "Backend Modules, Extension Points And Compatibility"
        path: sections/section-010/module-02/course-03-modules-extension-points-and-compatibility.md
      - type: reading
        title: "Question"
        path: sections/section-010/module-02/labs/lab-01/question.md
      - type: lab
        title: "Install A Backend Plugin And A Module Lab"
        path: sections/section-010/module-02/labs/lab-01
        difficulty: intermediate
        estimated_duration: 30m
        topic: backstage-plugins
        task_kind: fix
        tags: [backstage, backend-plugin, createBackendPlugin, createBackendModule, coreServices, extension-point, backend-add]
        learning_goals:
          - Give a backend plugin the right plugin id and mount its router with the httpRouter service
          - Use a public extension point from a backend module and add a processor
          - Install the plugin and module with backend.add and add the package dependencies
        resources:
          - name: "Backend system architecture"
            url: https://backstage.io/docs/backend-system/architecture/index
          - name: "Backend modules"
            url: https://backstage.io/docs/backend-system/architecture/modules
          - name: "Extension points"
            url: https://backstage.io/docs/backend-system/architecture/extension-points
      - type: reading
        title: "Summary"
        path: sections/section-010/module-02/course-04-summary.md

      - type: reading
        title: "Question"
        path: sections/section-010/capstone/labs/lab-01/question.md
      - type: lab
        title: "Capstone: Frontend And Backend Plugins"
        path: sections/section-010/capstone/labs/lab-01
        difficulty: advanced
        estimated_duration: 45m
        topic: backstage-plugins
        task_kind: build
        tags: [backstage, createFrontendPlugin, PageBlueprint, createBackendPlugin, extension-point, createBackendModule, rootConfig, secrets]
        learning_goals:
          - Rewrite a legacy frontend plugin for the new frontend system and register it in createApp features
          - Register an extension point in a backend plugin and use it from a backend module
          - Move a secret from source code to backend configuration and install the packages with backend.add
        resources:
          - name: "Frontend plugins"
            url: https://backstage.io/docs/frontend-system/building-plugins/index
          - name: "Backend plugins"
            url: https://backstage.io/docs/backend-system/architecture/plugins
