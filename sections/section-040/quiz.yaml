# Knowledge check for section 040. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats072-040
course_id: ATS072
exam_code: CBA
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-040
  title: "Using Material UI components"
questions:
  - id: ats072-040-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Identify the Material UI generation of a plugin from its imports and package.json"
    source_readings:
      - sections/section-040/module-01/course-01-material-ui-versions-and-import-paths.md
    prompt: "The `scout` plugin imports `import Grid from '@material-ui/core/Grid'` and its `package.json` lists `@material-ui/core` under dependencies. Which statement is correct?"
    options:
      - id: a
        text: "The generation cannot be known until the plugin is built."
        explanation: "The import path and `package.json` already tell the generation, with no build."
      - id: b
        text: "The plugin uses Material UI v4, because the `@material-ui` scope is the v4 package family."
        explanation: "Correct. The npm scope identifies the generation: `@material-ui` is v4 and `@mui` is v5."
      - id: c
        text: "The plugin uses Material UI v5, because `Grid` exists only in v5."
        explanation: "`Grid` exists in both generations. The scope decides the generation."
      - id: d
        text: "The plugin uses both generations, because `core` appears in the name."
        explanation: "The word `core` is part of the v4 package name. It does not mean both generations."
    correct_option: b
    explanation: "Correct. The npm scope identifies the generation: `@material-ui` is v4 and `@mui` is v5."

  - id: ats072-040-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain why imports must match declared dependencies"
    source_readings:
      - sections/section-040/module-01/course-01-material-ui-versions-and-import-paths.md
    prompt: "A teammate adds `import Button from '@mui/material/Button'` to a plugin whose `package.json` declares only `@material-ui/core`. The code works on their machine because another workspace package installs `@mui/material`. What is the real problem?"
    options:
      - id: a
        text: "`Button` does not exist in `@mui/material`."
        explanation: "`Button` exists in both generations."
      - id: b
        text: "The import must use a named import from the package root."
        explanation: "Path imports are valid in both generations. The import style is not the problem."
      - id: c
        text: "None. A hoisted package is available to every workspace, so the import is valid."
        explanation: "Hoisting makes the import resolve locally, but it is not a declaration, so the plugin breaks when used alone."
      - id: d
        text: "The plugin depends on a package it does not declare, and it also loads a second Material UI generation."
        explanation: "Correct. The dependency is hidden and works only because of hoisting. The page now loads two styling engines."
    correct_option: d
    explanation: "Correct. The dependency is hidden and works only because of hoisting. The page now loads two styling engines."

  - id: ats072-040-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find mixed-generation imports in a component"
    source_readings:
      - sections/section-040/module-01/course-01-material-ui-versions-and-import-paths.md
    prompt: "A card file contains `import Typography from '@material-ui/core/Typography'` and `import { makeStyles } from '@mui/styles'`. The plugin declares only `@material-ui/core`. Which change fixes the file?"
    options:
      - id: a
        text: "Add `@mui/styles` to the dependencies and keep both imports."
        explanation: "This keeps two generations in one component and hides the mismatch instead of fixing it."
      - id: b
        text: "Change the `Typography` import to `@mui/material/Typography`."
        explanation: "This moves the file further from the declared dependency."
      - id: c
        text: "Delete `makeStyles` and use the `sx` prop in the same file."
        explanation: "`sx` is a v5 feature, so it does not fit a v4 plugin."
      - id: d
        text: "Change the `makeStyles` import to `@material-ui/core/styles`."
        explanation: "Correct. `makeStyles` then comes from the declared v4 package and reads the v4 theme."
    correct_option: d
    explanation: "Correct. `makeStyles` then comes from the declared v4 package and reads the v4 theme."

  - id: ats072-040-q04
    type: single_choice
    difficulty: beginner
    learning_objective: "Choose Grid props for a responsive layout"
    source_readings:
      - sections/section-040/module-01/course-02-grid-typography-button-and-card.md
    prompt: "Cards must fill the full row on a phone and take half the row from the medium breakpoint up. Which markup does that?"
    options:
      - id: a
        text: "`<Grid container xs={12} md={6}>` around each card"
        explanation: "`container` sets up the row. The column props belong on the items."
      - id: b
        text: "`<Grid item xs={12} md={6}>` inside a `<Grid container>`"
        explanation: "Correct. A twelve-column row gives `xs={12}` as full width and `md={6}` as half width."
      - id: c
        text: "`<Grid item xs={6} md={12}>` inside a `<Grid container>`"
        explanation: "The values are reversed: this is half width on phones and full width on medium screens."
      - id: d
        text: "`<Grid item spacing={12}>` inside a `<Grid container>`"
        explanation: "`spacing` is a container prop for the gap between items, not a column width."
    correct_option: b
    explanation: "Correct. A twelve-column row gives `xs={12}` as full width and `md={6}` as half width."

  - id: ats072-040-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose between Button with href and a router link"
    source_readings:
      - sections/section-040/module-01/course-02-grid-typography-button-and-card.md
    prompt: "A card must open another page of the same Backstage app without a full page reload. Which choice is best?"
    options:
      - id: a
        text: "A `Typography` with a `variant` of `button`."
        explanation: "`variant` changes only the text style. It adds no navigation."
      - id: b
        text: "A `Button` with `href`, because Material UI always routes in the app."
        explanation: "`Button` with `href` renders a plain anchor, which causes a full page load."
      - id: c
        text: "A `div` with an `onClick` that sets `window.location`."
        explanation: "A `div` has no role and no keyboard focus, and it also reloads the page."
      - id: d
        text: "A `Button` rendered as the Backstage `Link` from `@backstage/core-components` with a `to` prop."
        explanation: "Correct. `Link` uses the app router, and the button keeps the link semantics."
    correct_option: d
    explanation: "Correct. `Link` uses the app router, and the button keeps the link semantics."

  - id: ats072-040-q06
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain what InfoCard adds over a plain Material UI card"
    source_readings:
      - sections/section-040/module-01/course-02-grid-typography-button-and-card.md
    prompt: "Why does the example plugin use `InfoCard` from `@backstage/core-components` and not `Card` from Material UI?"
    options:
      - id: a
        text: "`InfoCard` is v5 only, so it removes the need for `makeStyles`."
        explanation: "`InfoCard` does not remove the need for styles, and a plugin keeps one generation."
      - id: b
        text: "`Card` is not available in Material UI v4."
        explanation: "`Card` exists in v4. The reason to prefer `InfoCard` is portal consistency."
      - id: c
        text: "`InfoCard` is the only card that works with `Grid`."
        explanation: "`Card` also works inside a `Grid` item."
      - id: d
        text: "`InfoCard` provides the portal card look, a `title`, optional `deepLink` and `actions`, and an error boundary around its content."
        explanation: "Correct. It follows the portal conventions and keeps one failing card from blanking the page."
    correct_option: d
    explanation: "Correct. It follows the portal conventions and keeps one failing card from blanking the page."

  - id: ats072-040-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Write theme-aware styles with makeStyles"
    source_readings:
      - sections/section-040/module-01/course-03-styling-with-makestyles-and-styled.md
    prompt: "In a v4 plugin, which style keeps the vertical margin of a detail line tied to the portal spacing unit?"
    options:
      - id: a
        text: "`makeStyles(theme => ({ detail: { margin: theme.spacing(2, 0) } }))`"
        explanation: "Correct. The callback receives the theme, so the margin follows its spacing unit."
      - id: b
        text: "`<Box sx={{ my: 2 }}>` from `@material-ui/core`"
        explanation: "The `sx` prop is a v5 feature and does not apply in v4."
      - id: c
        text: "`styled('p')(({ theme }) => ({ margin: theme.spacing(2, 0) }))` from `@material-ui/core`"
        explanation: "`styled` with this callback shape is the v5 API from `@mui/material/styles`."
      - id: d
        text: "`makeStyles({ detail: { margin: '16px 0' } })`"
        explanation: "This is a fixed value and ignores the theme spacing unit."
    correct_option: a
    explanation: "Correct. The callback receives the theme, so the margin follows its spacing unit."

  - id: ats072-040-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Map a v4 style rule to the v5 equivalent"
    source_readings:
      - sections/section-040/module-01/course-03-styling-with-makestyles-and-styled.md
    prompt: "A team migrates a whole plugin from v4 to v5. A v4 rule reads `makeStyles(theme => ({ detail: { margin: theme.spacing(2, 0) } }))`. Which statement describes a correct migration step?"
    options:
      - id: a
        text: "Keep `makeStyles` and change only the import to `@mui/material`."
        explanation: "`@mui/material` does not export `makeStyles`."
      - id: b
        text: "Replace it with `styled('p')(({ theme }) => ({ margin: theme.spacing(2, 0) }))` from `@mui/material/styles` and update `package.json` and the other imports of the plugin."
        explanation: "Correct. The rule keeps reading `theme.spacing`, and the migration covers dependencies, imports and styles together."
      - id: c
        text: "Replace it with `sx` in a v4 `Box` and keep the v4 dependencies."
        explanation: "`sx` does not work with v4 components."
      - id: d
        text: "Move the rule into a hard-coded `style` attribute."
        explanation: "A fixed value drops the theme and is not a migration."
    correct_option: b
    explanation: "Correct. The rule keeps reading `theme.spacing`, and the migration covers dependencies, imports and styles together."

  - id: ats072-040-q09
    type: single_choice
    difficulty: beginner
    learning_objective: "Create and register a unified theme"
    source_readings:
      - sections/section-040/module-02/course-01-creating-and-registering-a-theme.md
    prompt: "A custom theme file exports `scoutTheme`, built with `createUnifiedTheme`. The portal still shows the default colors. What is the most likely cause?"
    options:
      - id: a
        text: "Themes apply only after the backend restarts."
        explanation: "A theme is frontend code, and the backend plays no part."
      - id: b
        text: "The theme was never passed to `createApp` through a `themes` entry with a `UnifiedThemeProvider` Provider."
        explanation: "Correct. An unused theme file is valid code and changes nothing."
      - id: c
        text: "`createUnifiedTheme` can only build dark themes."
        explanation: "It builds light and dark themes from the palettes you pass."
      - id: d
        text: "The palette must be written without `palettes.light`."
        explanation: "Spreading `palettes.light` is the normal way to start from the defaults."
    correct_option: b
    explanation: "Correct. An unused theme file is valid code and changes nothing."

  - id: ats072-040-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain what UnifiedThemeProvider does"
    source_readings:
      - sections/section-040/module-02/course-01-creating-and-registering-a-theme.md
    prompt: "Why does the application mount `UnifiedThemeProvider` and not only the v5 `ThemeProvider` from `@mui/material`?"
    options:
      - id: a
        text: "It stores the theme on the server so users share it."
        explanation: "The provider runs in the browser and stores nothing on a server."
      - id: b
        text: "It chooses light or dark from the `variant` field and ignores the palette."
        explanation: "The palette decides the colors. `variant` labels the appearance."
      - id: c
        text: "It turns v4 components into v5 components."
        explanation: "It does not convert components. It provides a theme."
      - id: d
        text: "It provides one theme to both the v4 and the v5 theme contexts, so plugins of either generation use the same colors."
        explanation: "Correct. A single-generation provider leaves the other generation on its default look."
    correct_option: d
    explanation: "Correct. A single-generation provider leaves the other generation on its default look."

  - id: ats072-040-q11
    type: single_choice
    difficulty: intermediate
    learning_objective: "Replace hard-coded colors with theme tokens"
    source_readings:
      - sections/section-040/module-02/course-02-theme-tokens-and-semantic-controls.md
    prompt: "A panel uses `color: '#333333'` and looks fine in the light theme. Users report it is unreadable in the dark theme. Which change fixes the cause?"
    options:
      - id: a
        text: "Read the color from the theme: `color: theme.palette.text.primary` inside `makeStyles(theme => ...)`."
        explanation: "Correct. `text.primary` is dark in the light palette and light in the dark palette."
      - id: b
        text: "Add `!important` after the color."
        explanation: "`!important` changes priority and does not make the value follow the theme."
      - id: c
        text: "Copy the color into every plugin so it is consistent."
        explanation: "Copies spread the same fixed value and defeat the purpose of one theme."
      - id: d
        text: "Darken the value to `#222222`."
        explanation: "A fixed color is still wrong on a dark background."
    correct_option: a
    explanation: "Correct. `text.primary` is dark in the light palette and light in the dark palette."

  - id: ats072-040-q12
    type: single_choice
    difficulty: beginner
    learning_objective: "Give icon-only controls an accessible name"
    source_readings:
      - sections/section-040/module-02/course-02-theme-tokens-and-semantic-controls.md
    prompt: "An `IconButton` contains only a refresh icon. A screen reader announces just \"button\". What is the correct fix?"
    options:
      - id: a
        text: "Add `aria-label=\"Refresh scout status\"` to the `IconButton`."
        explanation: "Correct. The label gives the control an accessible name that says what the action does."
      - id: b
        text: "Change the icon color to a higher contrast."
        explanation: "Contrast helps sighted users and gives no name to a screen reader."
      - id: c
        text: "Replace the `IconButton` with a `div` and an `onClick`."
        explanation: "A `div` has no role and no keyboard focus, which is worse."
      - id: d
        text: "Wrap the icon in a tooltip and leave the button as it is."
        explanation: "A tooltip is not a reliable replacement for a label."
    correct_option: a
    explanation: "Correct. The label gives the control an accessible name that says what the action does."

  - id: ats072-040-q13
    type: single_choice
    difficulty: advanced
    learning_objective: "Design status states that do not depend on color alone"
    source_readings:
      - sections/section-040/module-02/course-03-accessible-status-and-loading-states.md
    prompt: "A scout has not reported for ten minutes, and the page has no data about its state. Which presentation is correct for the status badge?"
    options:
      - id: a
        text: "Hide the badge and show nothing for this scout."
        explanation: "A missing badge reads as \"no problem\" and hides the gap."
      - id: b
        text: "`<StatusOK>scout is operational</StatusOK>`, because no error was reported."
        explanation: "A missing report is not evidence of health."
      - id: c
        text: "A green dot without text, so the page stays compact."
        explanation: "Color alone is not accessible and the state is also wrong."
      - id: d
        text: "`<StatusPending>scout status is unknown</StatusPending>`, with words that name the unknown state."
        explanation: "Correct. The state is shown honestly and in text, not only in color."
    correct_option: d
    explanation: "Correct. The state is shown honestly and in text, not only in color."

  - id: ats072-040-q14
    type: single_choice
    difficulty: advanced
    learning_objective: "Keep loading, error and empty states distinct"
    source_readings:
      - sections/section-040/module-02/course-03-accessible-status-and-loading-states.md
    prompt: "A page loads scouts with `useAsyncRetry`. The request fails with a server error. The page renders `EmptyState` with \"No scouts reported\". What is wrong, and what is the fix?"
    options:
      - id: a
        text: "The `useAsyncRetry` hook swallows errors, so nothing can be done."
        explanation: "The hook returns an `error` value for exactly this case."
      - id: b
        text: "The page should return `null` on error so users do not see technical detail."
        explanation: "A blank page hides the failure and gives users no next step."
      - id: c
        text: "The empty check runs before the error check, so a failed request looks like an empty list. Check loading first, then `error` with `ResponseErrorPanel`, then the empty list."
        explanation: "Correct. The order must separate wait, failure and nothing-to-show."
      - id: d
        text: "`EmptyState` must never be used. Show `Progress` for every state."
        explanation: "`EmptyState` is the right component for an empty successful response."
    correct_option: c
    explanation: "Correct. The order must separate wait, failure and nothing-to-show."

